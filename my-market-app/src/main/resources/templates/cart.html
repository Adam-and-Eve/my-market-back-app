<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head>
    <meta charset="utf-8">
    <title>Корзина — Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">

    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <a th:href="@{/items}" class="text-decoration-none">
                        <span class="badge text-bg-success">Витрина магазина</span>
                    </a>
                </h2>
                <div sec:authorize="isAuthenticated()" class="hstack gap-2 ms-auto">
                    <a th:href="@{/orders}" class="btn btn-secondary bi bi-file-earmark-text"> Заказы</a>
                    <a th:href="@{/items}" class="btn btn-outline-secondary bi bi-arrow-left-square"> Главная</a>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger bi bi-box-arrow-right"> Выйти</button>
                    </form>
                </div>
                <div sec:authorize="isAnonymous()" class="hstack gap-2 ms-auto">
                    <a th:href="@{/items}" class="btn btn-outline-secondary bi bi-arrow-left-square"> Главная</a>
                    <a th:href="@{/oauth2/authorization/keycloak}" class="btn btn-primary bi bi-box-arrow-in-right"> Войти</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row p-2" th:each="item : ${items}">
        <div class="col">
            <div class="card shadow-sm">
                <div class="row g-0 align-items-center">
                    <div class="col-md-3 d-flex justify-content-center p-2">
                        <a th:href="@{/items/{id}(id=${item.id()})}">
                            <img th:src="${'/'+item.imgPath()}" alt="Нет изображения" class="img-fluid rounded" style="max-width: 200px; max-height: 200px; object-fit: contain;">
                        </a>
                    </div>
                    <div class="col-md-9">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${item.title()}"></h5>
                            <div class="mb-2">
                                <span class="badge text-bg-success" th:text="${item.price()}+' руб.'"></span>
                            </div>
                            <p class="card-text text-muted" th:text="${item.description()}"></p>
                            <form th:action="@{/cart/items}" method="post">
                                <div class="hstack gap-3">
                                    <input type="hidden" name="id" th:value="${item.id()}">
                                    <button type="submit" class="btn btn-outline-secondary" name="action" value="MINUS">-</button>
                                    <span class="fw-bold fs-5 px-2" th:text="${item.count()}"></span>
                                    <button type="submit" class="btn btn-outline-secondary" name="action" value="PLUS">+</button>
                                    <button type="submit" class="btn btn-danger ms-auto bi bi-trash" name="action" value="DELETE"></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row p-2">
        <div class="col">
            <div class="alert alert-danger" role="alert" th:if="${param.paymentError}">
                Заказ не оформлен: платёж не выполнен.
            </div>
            <div class="alert alert-warning" role="alert" th:if="${!items.isEmpty() && paymentMessage != null}" th:text="${paymentMessage}">
            </div>
            <form th:action="@{/buy}" method="post" th:if="${!items.isEmpty()}">
                <div class="hstack gap-3">
                    <h2 th:text="'Итого: '+${total}+' руб.'"></h2>
                    <span class="badge text-bg-secondary fs-6" th:if="${paymentAvailable}" th:text="'Баланс: '+${balance}+' руб.'"></span>
                    <button class="btn btn-warning ms-auto" th:disabled="${!purchaseAvailable}">Купить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
