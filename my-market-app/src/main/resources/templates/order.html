<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head>
    <meta charset="utf-8">
    <title th:text="'Заказ №' + ${order.id()} + ' — Витрина магазина'">Заказ — Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="alert alert-success alert-dismissible fade show m-0 rounded-0" role="alert" th:if="${newOrder}">
    <div class="container d-flex align-items-center">
        <span>Поздравляем! Успешная покупка! &#128578;</span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<div class="container p-2">

    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <a th:href="@{/items}" class="text-decoration-none">
                        <span class="badge text-bg-success">Витрина магазина</span>
                    </a>
                </h2>
                <div sec:authorize="isAuthenticated()" class="hstack gap-2 ms-auto">
                    <a th:href="@{/orders}" class="btn btn-secondary bi bi-file-earmark-text"> Заказы</a>
                    <a th:href="@{/cart/items}" class="btn btn-secondary bi bi-cart4"> Корзина</a>
                    <a th:href="@{/items}" class="btn btn-outline-secondary bi bi-arrow-left-square"> Главная</a>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger bi bi-box-arrow-right"> Выйти</button>
                    </form>
                </div>
                <div sec:authorize="isAnonymous()" class="hstack gap-2 ms-auto">
                    <a th:href="@{/items}" class="btn btn-outline-secondary bi bi-arrow-left-square"> Главная</a>
                    <a th:href="@{/oauth2/authorization/keycloak}" class="btn btn-primary bi bi-box-arrow-in-right"> Войти</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row p-2">
        <div class="col">
            <h2 class="fw-bold mb-0" th:text="${'Заказ № ' + order.id()}"></h2>
        </div>
    </div>

    <div class="row p-2 g-3">
        <div class="col-12" th:each="item : ${order.items()}">
            <div class="card shadow-sm border-0">
                <div class="card-body p-3">
                    <div class="row align-items-center g-2">
                        <div class="col-md-6">
                            <h5 class="card-title mb-0 fw-bold" th:text="${item.title()}"></h5>
                        </div>
                        <div class="col-md-2 text-md-center">
                            <span class="text-secondary" th:text="${item.count() + ' шт.'}"></span>
                        </div>
                        <div class="col-md-2 text-md-center">
                            <span class="badge text-bg-success" th:text="${item.price() + ' руб.'}"></span>
                        </div>
                        <div class="col-md-2 text-md-end">
                            <span class="fw-bold text-dark" th:text="${'Сумма: ' + (item.count() * item.price()) + ' руб.'}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row p-2">
        <div class="col">
            <div class="card shadow-sm border-0 p-3 bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fs-4 fw-bold">Итого по заказу:</span>
                    <h3 class="fw-bold text-success m-0" th:text="${order.totalSum() + ' руб.'}"></h3>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
