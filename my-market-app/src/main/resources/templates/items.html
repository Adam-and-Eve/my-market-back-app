<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head>
    <meta charset="utf-8">
    <title>Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<form id="main"></form>

<div class="container p-2">

    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <a th:href="@{/items}" class="text-decoration-none">
                        <span class="badge text-bg-success">Витрина магазина</span>
                    </a>
                </h2>
                <div sec:authorize="isAuthenticated()" class="hstack gap-2 ms-auto">
                    <a th:href="@{/orders}" class="btn btn-secondary bi bi-file-earmark-text"> Заказы</a>
                    <a th:href="@{/cart/items}" class="btn btn-secondary bi bi-cart4"> Корзина</a>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger bi bi-box-arrow-right"> Выйти</button>
                    </form>
                </div>
                <div sec:authorize="isAnonymous()" class="hstack gap-2 ms-auto">
                    <a th:href="@{/oauth2/authorization/keycloak}" class="btn btn-primary bi bi-box-arrow-in-right"> Войти</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row p-2">
        <div class="col">
            <div class="card shadow-sm border-0 p-3 bg-white">
                <div class="row g-2 align-items-center">
                    <div class="col-md-6 col-12">
                        <div class="input-group">
                            <input class="form-control" type="search" placeholder="Найти..." aria-label="Поиск" name="search" th:value="${search}" form="main"/>
                            <button class="btn btn-outline-success bi bi-search" type="submit" form="main"> Найти</button>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="form-floating">
                            <select class="form-select" id="sort" name="sort" onchange="document.getElementById('main').submit()" form="main">
                                <option value="NO" th:selected="${sort=='NO'}">нет</option>
                                <option value="ALPHA" th:selected="${sort=='ALPHA'}">по алфавиту</option>
                                <option value="PRICE" th:selected="${sort=='PRICE'}">по цене</option>
                            </select>
                            <label for="sort">Сортировка</label>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="form-floating">
                            <select class="form-select" id="pageSize" name="pageSize" onchange="document.getElementById('main').submit()" form="main">
                                <option value="2" th:selected="${paging.pageSize()==2}">2</option>
                                <option value="5" th:selected="${paging.pageSize()==5}">5</option>
                                <option value="10" th:selected="${paging.pageSize()==10}">10</option>
                                <option value="20" th:selected="${paging.pageSize()==20}">20</option>
                                <option value="50" th:selected="${paging.pageSize()==50}">50</option>
                                <option value="100" th:selected="${paging.pageSize()==100}">100</option>
                            </select>
                            <label for="pageSize">На странице</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row p-2 g-3" th:each="itemsRow : ${items}">
        <div class="col" th:each="cell : ${itemsRow}">
            <div class="card h-100 shadow-sm border-0 overflow-hidden" th:if="${!cell.placeholder}">
                <a th:href="@{/items/{id}(id=${cell.item.id()})}" class="text-center bg-white p-2">
                    <img th:src="${'/'+cell.item.imgPath()}"
                         class="card-img-top img-fluid"
                         alt="Нет изображения"
                         style="max-height: 250px; width: 100%; aspect-ratio: 1 / 1; object-fit: contain;">
                </a>
                <div class="card-body d-flex flex-column p-3">
                    <h5 class="card-title fw-bold" th:text="${cell.item.title()}"></h5>
                    <div class="mb-2">
                        <span class="badge text-bg-success fs-6" th:text="${cell.item.price()}+' руб.'"></span>
                    </div>
                    <p class="card-text text-muted flex-grow-1" th:text="${cell.item.description()}"></p>

                    <form method="post" th:action="@{/items}" sec:authorize="isAuthenticated()" class="mt-auto pt-2 border-top">
                        <div class="hstack gap-2">
                            <input type="hidden" name="id" th:value="${cell.item.id()}">
                            <input type="hidden" name="search" th:value="${search}">
                            <input type="hidden" name="sort" th:value="${sort}">
                            <input type="hidden" name="pageSize" th:value="${paging.pageSize()}">
                            <input type="hidden" name="pageNumber" th:value="${paging.pageNumber()}">

                            <button type="submit" class="btn btn-outline-secondary px-3" name="action" value="MINUS">-</button>
                            <span class="fw-bold px-1" th:text="${cell.item.count()}"></span>
                            <button type="submit" class="btn btn-outline-secondary px-3" name="action" value="PLUS">+</button>

                            <button type="submit" class="btn btn-warning ms-auto bi bi-cart4" name="action" value="PLUS" th:if="${cell.item.count()==0}"></button>
                        </div>
                    </form>
                    <div sec:authorize="isAnonymous()" class="mt-auto pt-2 border-top">
                        <a th:href="@{/oauth2/authorization/keycloak}" class="btn btn-warning w-100 bi bi-cart4"> Войти, чтобы купить</a>
                    </div>
                </div>
            </div>
            <div th:if="${cell.placeholder}">&nbsp;</div>
        </div>
    </div>

    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3 justify-content-center">
                <button type="submit" class="btn btn-white shadow-sm px-3" th:if="${paging.hasPrevious()}" name="pageNumber" th:value="${paging.pageNumber()-1}" form="main">&larr; Назад</button>
                <span class="fw-semibold" th:text="${'Страница: '+paging.pageNumber()}"></span>
                <button type="submit" class="btn btn-white shadow-sm px-3" th:if="${paging.hasNext()}" name="pageNumber" th:value="${paging.pageNumber()+1}" form="main">Вперёд &rarr;</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
