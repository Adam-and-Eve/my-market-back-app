<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head>
    <meta charset="utf-8">
    <title th:text="${item.title()} + ' — Витрина магазина'">Страница товара</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <a href="/items" class="text-decoration-none">
                        <span class="badge text-bg-success">Витрина магазина</span>
                    </a>
                </h2>
                <div sec:authorize="isAuthenticated()" class="hstack gap-2 ms-auto">
                    <a th:href="@{/orders}" class="btn btn-secondary bi bi-file-earmark-text"> Заказы</a>
                    <a th:href="@{/cart/items}" class="btn btn-secondary bi bi-cart4"> Корзина</a>
                    <a th:href="@{/items}" class="btn btn-outline-secondary bi bi-arrow-left-square"> Главная</a>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger bi bi-box-arrow-right"> Выйти</button>
                    </form>
                </div>
                <div sec:authorize="isAnonymous()" class="hstack gap-2 ms-auto">
                    <a th:href="@{/items}" class="btn btn-outline-secondary bi bi-arrow-left-square"> Главная</a>
                    <a href="/oauth2/authorization/keycloak" class="btn btn-primary bi bi-box-arrow-in-right"> Войти</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row p-2">
        <div class="col">
            <div class="card shadow-sm border-0 overflow-hidden">
                <div class="row g-0">
                    <div class="col-md-5 col-lg-4 bg-white d-flex align-items-center justify-content-center p-3">
                        <img th:src="${'/'+item.imgPath()}"
                             class="img-fluid rounded"
                             alt="Нет изображения"
                             style="max-height: 400px; width: 100%; aspect-ratio: 1 / 1; object-fit: contain;">
                    </div>

                    <div class="col-md-7 col-lg-8">
                        <div class="card-body p-4 d-flex flex-column h-100">
                            <h2 class="card-title fw-bold mb-3" th:text="${item.title()}"></h2>

                            <div class="mb-4">
                                <span class="badge text-bg-success fs-5 px-3 py-2" th:text="${item.price()} + ' руб.'"></span>
                            </div>

                            <p class="card-text text-secondary mb-4 flex-grow-1" style="white-space: pre-line;" th:text="${item.description()}"></p>

                            <div class="pt-3 border-top mt-auto">
                                <form th:action="@{/items/{id}(id=${item.id()})}" method="post" sec:authorize="isAuthenticated()">
                                    <div class="hstack gap-3 w-auto" style="max-width: 360px;">
                                        <button type="submit" class="btn btn-outline-secondary px-3" name="action" value="MINUS">-</button>
                                        <span class="fw-bold fs-5 px-2" th:text="${item.count()}"></span>
                                        <button type="submit" class="btn btn-outline-secondary px-3" name="action" value="PLUS">+</button>

                                        <button type="submit" class="btn btn-warning ms-auto bi bi-cart4 px-3" name="action" value="PLUS" th:if="${item.count()==0}">
                                            В корзину
                                        </button>
                                    </div>
                                </form>

                                <div sec:authorize="isAnonymous()">
                                    <a href="/oauth2/authorization/keycloak" class="btn btn-warning bi bi-cart4 px-4"> Войти, чтобы купить</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
