<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<head>
    <meta charset="utf-8">
    <title>Мои заказы — Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">

    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <a th:href="@{/items}" class="text-decoration-none">
                        <span class="badge text-bg-success">Витрина магазина</span>
                    </a>
                </h2>
                <div sec:authorize="isAuthenticated()" class="hstack gap-2 ms-auto">
                    <a th:href="@{/cart/items}" class="btn btn-secondary bi bi-cart4"> Корзина</a>
                    <a th:href="@{/items}" class="btn btn-outline-secondary bi bi-arrow-left-square"> Главная</a>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger bi bi-box-arrow-right"> Выйти</button>
                    </form>
                </div>
                <div sec:authorize="isAnonymous()" class="hstack gap-2 ms-auto">
                    <a th:href="@{/items}" class="btn btn-outline-secondary bi bi-arrow-left-square"> Главная</a>
                    <a th:href="@{/oauth2/authorization/keycloak}" class="btn btn-primary bi bi-box-arrow-in-right"> Войти</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row p-2">
        <div class="col">
            <h2 class="fw-bold mb-0">История заказов</h2>
        </div>
    </div>

    <div class="row p-2 g-3" th:each="order : ${orders}">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 border-bottom-0 d-flex justify-content-between align-items-center">
                    <a th:text="${'Заказ №' + order.id()}"
                       th:href="@{/orders/{id}(id=${order.id()})}"
                       class="fw-bold fs-5 text-decoration-none text-primary"></a>
                    <a th:href="@{/orders/{id}(id=${order.id()})}"
                       class="btn btn-sm btn-outline-primary bi bi-eye"> Подробнее</a>
                </div>
                <ul class="list-group list-group-flush border-top border-bottom">
                    <li class="list-group-item d-flex justify-content-between align-items-center py-2" th:each="item : ${order.items()}">
                        <span>
                            <span class="fw-semibold" th:text="${item.title()}"></span>
                            <span class="text-muted ms-2" th:text="'(' + ${item.count()} + ' шт.)'"></span>
                        </span>
                        <span class="fw-bold text-dark" th:text="${(item.price() * item.count()) + ' руб.'}"></span>
                    </li>
                </ul>
                <div class="card-footer bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                    <span class="text-muted">Итоговая сумма:</span>
                    <b class="fs-5 text-success" th:text="${'Сумма: ' + order.totalSum() + ' руб.'}"></b>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
