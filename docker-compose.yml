services:
  keycloak:
    profiles:
      - infra
      - full
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    container_name: my-market-keycloak
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8082
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "8082:8080"

  redis:
    profiles:
      - infra
      - full
    image: redis:7-alpine
    container_name: my-market-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  payment-service:
    profiles:
      - full
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    environment:
      SERVER_PORT: 8081
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8082/realms/my-market
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/my-market/protocol/openid-connect/certs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    ports:
      - "8081:8081"

  market-app:
    profiles:
      - full
    build:
      context: .
      dockerfile: my-market-app/Dockerfile
    container_name: market-app
    depends_on:
      redis:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_PAYMENT_SERVICE_BASE_URL: http://payment-service:8081
      KEYCLOAK_LOGIN_CLIENT_SECRET: dev-login-secret
      KEYCLOAK_AUTHORIZATION_URI: http://localhost:8082/realms/my-market/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/my-market/protocol/openid-connect/token
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/my-market/protocol/openid-connect/certs
      KEYCLOAK_LOGOUT_URI: http://localhost:8082/realms/my-market/protocol/openid-connect/logout
    ports:
      - "8080:8080"